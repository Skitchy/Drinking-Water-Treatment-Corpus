name: Validate assurance artifacts

on:
  pull_request:
  push:
    branches:
      - main
      - "experiment/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Foundry Pass 1 public evaluator bundle
        run: node experiments/foundry-pass-1/evaluator/verify-evaluator-bundle.mjs --mode=public

      - name: Validate schemas and acceptance artifacts
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Foundry Pass 2 public evaluator bundle (Ari)
        run: python3 experiments/foundry-pass-2/evaluator/ari/verify-ari-evaluator-bundle-v0.1.py --repo-root .

      - name: Foundry Pass 2 deterministic bundle regeneration
        working-directory: experiments/foundry-pass-2
        run: |
          before=$(sha256sum out/review-input-bundle.json | cut -d' ' -f1)
          python3 tools/emit_bundle.py
          after=$(sha256sum out/review-input-bundle.json | cut -d' ' -f1)
          echo "committed=$before regenerated=$after"
          test "$before" = "$after"

      - name: Foundry Pass 2 tests (boundary, reviewer harness, release gate)
        working-directory: experiments/foundry-pass-2
        run: python3 -m unittest discover -s tests -t . -v
