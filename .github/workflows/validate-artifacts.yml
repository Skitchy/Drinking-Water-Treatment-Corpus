name: Validate assurance artifacts

on:
  pull_request:
  push:
    branches:
      - main
      - "experiment/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Foundry Pass 1 public evaluator bundle
        run: node experiments/foundry-pass-1/evaluator/verify-evaluator-bundle.mjs --mode=public

      - name: Validate schemas and acceptance artifacts
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Foundry Pass 2 replacement commitments (Ari v0.3)
        run: python3 experiments/foundry-pass-2/evaluator/ari/verify-ari-evaluator-bundle-v0.1.2.py --repo-root .

      - name: Foundry Pass 2 committed bundle binds the v0.3 packet (public check; controls are private)
        working-directory: experiments/foundry-pass-2
        run: python3 tools/check_bundle_bindings.py

      - name: Foundry Pass 2 public test fixture (burned v0.1 controls; never the run bundle)
        working-directory: experiments/foundry-pass-2
        run: python3 tools/emit_test_fixture.py

      - name: Foundry Pass 2 tests (boundary, reviewer harness, release gate)
        working-directory: experiments/foundry-pass-2
        env:
          FOUNDRY_PASS2_OUT: out-fixture
        run: python3 -m unittest discover -s tests -t . -v
